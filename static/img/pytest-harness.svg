<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1f2937" flood-opacity="0.14"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="6" y="6" width="748" height="348" rx="18" fill="#ffffff" stroke="#e8e8f0" stroke-width="1.5"/>

  <!-- lanes -->
  <rect x="24" y="34" width="712" height="150" rx="14" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="44" y="58" font-size="14" font-weight="700" fill="#4f46e5">🖥️  Host — your PC</text>
  <rect x="24" y="216" width="712" height="128" rx="14" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5"/>
  <text x="44" y="240" font-size="14" font-weight="700" fill="#059669">🎯  Device — native_sim / board</text>

  <!-- arrows (under cards) -->
  <g fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)">
    <path d="M400,88 L400,106"/>                            <!-- test_calc.py -> pytest -->
    <path d="M188,135 L294,135"/>                           <!-- twister -> pytest (2) -->
    <path d="M500,135 L594,135"/>                           <!-- pytest -> report (5) -->
    <path d="M118,162 L118,200 L340,200 L340,252"/>         <!-- twister -> firmware (1) -->
    <path d="M375,162 L375,252"/>                            <!-- pytest -> firmware (3) -->
    <path d="M430,256 L430,162"/>                            <!-- firmware -> pytest (4) -->
  </g>

  <!-- cards -->
  <g>
    <rect x="320" y="50" width="160" height="38" rx="9" fill="#fff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#ds)"/>
    <text x="400" y="74" text-anchor="middle" font-size="13" font-family="ui-monospace, Menlo, monospace" font-weight="600" fill="#334155">test_calc.py</text>

    <rect x="48" y="108" width="140" height="54" rx="10" fill="#fff" stroke="#6366f1" stroke-width="2" filter="url(#ds)"/>
    <text x="118" y="140" text-anchor="middle" font-size="15" font-weight="700" fill="#4f46e5">Twister</text>

    <rect x="300" y="108" width="200" height="54" rx="10" fill="#fff" stroke="#6366f1" stroke-width="2" filter="url(#ds)"/>
    <text x="400" y="131" text-anchor="middle" font-size="15" font-weight="700" fill="#4f46e5">pytest</text>
    <text x="400" y="149" text-anchor="middle" font-size="11" fill="#6366f1">+ twister_harness plugin</text>

    <rect x="600" y="108" width="128" height="54" rx="10" fill="#fff" stroke="#10b981" stroke-width="2" filter="url(#ds)"/>
    <text x="664" y="140" text-anchor="middle" font-size="15" font-weight="700" fill="#059669">✅ Report</text>

    <rect x="300" y="256" width="200" height="56" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#ds)"/>
    <text x="400" y="281" text-anchor="middle" font-size="15" font-weight="600" fill="#334155">Firmware</text>
    <text x="400" y="299" text-anchor="middle" font-size="12" fill="#16a34a">shell + app code</text>
  </g>

  <!-- step badges + labels -->
  <g font-size="12" fill="#64748b">
    <text x="412" y="100" text-anchor="start">collected by</text>

    <circle cx="241" cy="135" r="11" fill="#6366f1"/><text x="241" y="139" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">2</text>
    <text x="241" y="121" text-anchor="middle">hand off DUT</text>

    <circle cx="547" cy="135" r="11" fill="#10b981"/><text x="547" y="139" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">5</text>
    <text x="547" y="121" text-anchor="middle">pass / fail</text>

    <circle cx="230" cy="200" r="11" fill="#6366f1"/><text x="230" y="204" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">1</text>
    <text x="230" y="192" text-anchor="middle">build + launch</text>

    <circle cx="375" cy="208" r="11" fill="#6366f1"/><text x="375" y="212" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">3</text>
    <text x="361" y="212" text-anchor="end">drive shell</text>

    <circle cx="430" cy="208" r="11" fill="#16a34a"/><text x="430" y="212" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">4</text>
    <text x="444" y="212" text-anchor="start">output</text>
  </g>
</svg>
