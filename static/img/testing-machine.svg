<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1f2937" flood-opacity="0.14"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="6" y="6" width="748" height="348" rx="18" fill="#ffffff" stroke="#e8e8f0" stroke-width="1.5"/>

  <!-- lanes -->
  <rect x="24" y="34" width="712" height="132" rx="14" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="44" y="58" font-size="14" font-weight="700" fill="#4f46e5">🖥️  Host — your PC</text>
  <rect x="24" y="198" width="712" height="132" rx="14" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5"/>
  <text x="44" y="222" font-size="14" font-weight="700" fill="#059669">🎯  Target — native_sim / board</text>

  <!-- arrows (drawn under cards) -->
  <g fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)">
    <path d="M196,113 L294,113"/>                          <!-- testcase -> twister -->
    <path d="M198,277 L294,277"/>                          <!-- ztest -> binary -->
    <path d="M375,142 L375,248"/>                           <!-- twister -> binary (1) -->
    <path d="M450,277 L514,277"/>                           <!-- binary -> console (2) -->
    <path d="M620,248 L620,182 L432,182 L432,142"/>         <!-- console -> twister (3) -->
    <path d="M450,113 L550,113"/>                           <!-- twister -> report (4) -->
  </g>

  <!-- cards -->
  <g>
    <rect x="48"  y="86" width="148" height="54" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#ds)"/>
    <text x="122" y="118" text-anchor="middle" font-size="14" font-weight="600" fill="#334155">testcase.yaml</text>

    <rect x="300" y="86" width="150" height="54" rx="10" fill="#fff" stroke="#6366f1" stroke-width="2" filter="url(#ds)"/>
    <text x="375" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#4f46e5">Twister</text>

    <rect x="556" y="86" width="160" height="54" rx="10" fill="#fff" stroke="#10b981" stroke-width="2" filter="url(#ds)"/>
    <text x="636" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#059669">✅ Report</text>

    <rect x="48"  y="250" width="150" height="54" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#ds)"/>
    <text x="123" y="282" text-anchor="middle" font-size="14" font-weight="600" fill="#334155">ztest macros</text>

    <rect x="300" y="250" width="150" height="54" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#ds)"/>
    <text x="375" y="282" text-anchor="middle" font-size="14" font-weight="600" fill="#334155">Test binary</text>

    <rect x="520" y="246" width="196" height="62" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#ds)"/>
    <text x="618" y="271" text-anchor="middle" font-size="14" font-weight="600" fill="#334155">Console</text>
    <text x="618" y="293" text-anchor="middle" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#16a34a">START / PASS / FAIL</text>
  </g>

  <!-- step badges + labels -->
  <g font-size="12" fill="#64748b">
    <text x="245" y="105" text-anchor="middle">what &amp; where</text>
    <text x="248" y="269" text-anchor="middle">compiled into</text>

    <circle cx="375" cy="195" r="11" fill="#6366f1"/><text x="375" y="199" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">1</text>
    <text x="332" y="199" text-anchor="end" fill="#64748b">build + run</text>

    <circle cx="482" cy="263" r="11" fill="#6366f1"/><text x="482" y="267" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">2</text>

    <circle cx="590" cy="182" r="11" fill="#6366f1"/><text x="590" y="186" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">3</text>
    <text x="500" y="177" text-anchor="middle" fill="#64748b">Twister greps it</text>

    <circle cx="500" cy="113" r="11" fill="#6366f1"/><text x="500" y="117" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">4</text>
    <text x="525" y="104" text-anchor="middle" fill="#64748b">pass / fail</text>
  </g>
</svg>
